# Exemplo conceitual da topologia futura do César Core.
# NÃO é usado por nenhum ambiente real nesta fase (TASK-118A não cria
# deployment). Loopback-only por padrão -- nunca publicar em 0.0.0.0.

services:
  cesar-core:
    build: ..
    ports:
      - "127.0.0.1:8100:8100"
    networks:
      - cesar-platform
    env_file:
      - ../.env

networks:
  cesar-platform:
    external: true
