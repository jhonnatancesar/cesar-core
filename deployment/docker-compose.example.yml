# Exemplo conceitual da topologia pretendida do César Core.
# O repositório ainda não contém Dockerfile nem deployment de produção;
# este arquivo documenta rede e publicação loopback-only. Não publicar a
# API em 0.0.0.0 sem uma decisão explícita de segurança.

services:
  cesar-core:
    build: ..
    ports:
      - "127.0.0.1:8100:8100"
    networks:
      - cesar-platform
    env_file:
      - ../.env

networks:
  cesar-platform:
    external: true
