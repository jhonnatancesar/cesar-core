[project]
name = "cesar-core"
version = "0.1.0"
description = "César Core -- infraestrutura central multi-aplicação de IA, Web Search e políticas de uso."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "httpx>=0.28,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1,<10.0",
  "pytest-cov>=7.1,<8.0",
  "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cesar_core"]

[tool.ruff]
required-version = ">=0.16,<0.17"
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=cesar_core",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "contract: exercises a real, locally running OmniRoute instance (no mocks).",
]
