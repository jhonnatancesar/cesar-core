services:
  cesar-core:
    environment:
      CESAR_CORE_ADMIN_PASSWORD_HASH_FILE: /run/secrets/admin_password_hash
      CESAR_CORE_ADMIN_CREDENTIAL_PEPPER_FILE: /run/secrets/admin_credential_pepper
      CESAR_CORE_ADMIN_ALLOWED_ORIGIN: ${CESAR_CORE_ADMIN_ALLOWED_ORIGIN:-http://127.0.0.1:8100}
      CESAR_CORE_ADMIN_COOKIE_SECURE: ${CESAR_CORE_ADMIN_COOKIE_SECURE:-false}
    secrets: [admin_password_hash, admin_credential_pepper]

secrets:
  admin_password_hash:
    file: ${CESAR_CORE_ADMIN_PASSWORD_HASH_FILE:-./.secrets/admin-password-hash}
  admin_credential_pepper:
    file: ${CESAR_CORE_ADMIN_CREDENTIAL_PEPPER_FILE:-./.secrets/admin-credential-pepper}
